name: GQL gates (Linux)
# Pre-PR gate run for the GQL extension: same checks we run locally, on Linux.
# Mirrors ci-workflow.yml's Linux recipe (Ninja, ccache, OpenSSL probe, dataset
# generation, WERROR=1) and adds the GQL-specific gates: dual-run self-test,
# opengql/tck conformance, and the full engine regression.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  gql-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEN: Ninja
      TEST_JOBS: 4
      NUM_THREADS: 4
      WERROR: '1'
    steps:
      - uses: actions/checkout@v4

      # No submodule init: this fork absorbed all former submodules (extension,
      # dataset, benchmark, ...) as regular tree content; .gitmodules is stale.

      - name: Sanity checks (ci-workflow parity)
        run: |
          # bash (not ./) — this tree's snapshot flattened exec bits (644 .sh)
          bash scripts/check-include-guards.sh src/include
          bash scripts/check-include-guards.sh test/include
          for dir in extension/*/src/include ;do
            bash scripts/check-include-guards.sh "$dir"
          done
          bash scripts/check-no-std-assert.sh src
          bash scripts/check-no-std-assert.sh extension
          python3 scripts/antlr4/hash.py src/antlr4/keywords.txt src/antlr4/Cypher.g4 > tmphashfile
          cmp tmphashfile scripts/antlr4/hash.md5
          rm tmphashfile

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: gql-gates-${{ runner.os }}-${{ github.ref }}
          max-size: 2G
          restore-keys: |
            gql-gates-${{ runner.os }}-refs/heads/main
            gql-gates-${{ runner.os }}-

      - name: Install uv
        run: pip3 install uv

      - name: Build (gql extension only, WERROR=1)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        shell: bash
        run: |
          # OpenSSL probe — same as ci-workflow.yml so https/INSTALL is exercised.
          LIBSSL_PATH=""
          if command -v ldconfig >/dev/null 2>&1; then
            LIBSSL_PATH=$(ldconfig -p | awk '/libssl.so.3/ {print $4; exit}')
          fi
          if [ -n "$LIBSSL_PATH" ]; then
            LIBCRYPTO_PATH=$(dirname "$LIBSSL_PATH")/libcrypto.so.3
            echo "Found OpenSSL libssl at $LIBSSL_PATH"
            export EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DOPENSSL_ROOT_DIR=/usr -DOPENSSL_INCLUDE_DIR=/usr/include -DOPENSSL_CRYPTO_LIBRARY=$LIBCRYPTO_PATH -DOPENSSL_SSL_LIBRARY=$LIBSSL_PATH"
          fi
          export EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DBUILD_EXTENSIONS=gql -DBUILD_EXTENSION_TESTS=TRUE -DBUILD_TESTS=TRUE"
          make relwithdebinfo

      # No Generate datasets step: this fork has no benchmark/ tree (the
      # serializer that builds binary-demo is absent — binary-demo is only
      # needed for shell-test, which these gates do not run), and the
      # dictionary-bug fixtures are already tracked in the tree. The Windows
      # baseline (1972/1975) was measured without running either generator.

      - name: GQL dual-run self-test (expect 161/161)
        run: |
          E2E=$(find build -name e2e_test -type f -print -quit)
          echo "E2E=$E2E"
          test -n "$E2E"
          E2E_TEST_FILES_DIRECTORY=extension "$E2E" --gtest_filter="gql~test~test_files~*"

      - name: TCK conformance (expect 190 green / 9 loud-fail / 7 skip)
        run: |
          E2E=$(find build -name e2e_test -type f -print -quit)
          test -n "$E2E"
          set +e
          out=$(E2E_BIN="$E2E" python3 extension/gql/test/tck/run_tck.py 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -4
          echo "run_tck exit=$rc (non-zero expected while the 9 known loud-rejection failures remain)"
          # The gate is the classified baseline ("TCK 不降"), not exit 0.
          echo "$out" | grep -F "RESULT: 70 passed, 120 passed-with-note, 9 failed, 7 skipped" \
            || { echo "TCK baseline drifted — failing the gate"; exit 1; }

      - name: Full engine regression
        run: |
          E2E=$(find build -name e2e_test -type f -print -quit)
          set +e
          E2E_TEST_FILES_DIRECTORY=test "$E2E" --gtest_filter="*" > engine_regress.log 2>&1
          set -e
          tail -12 engine_regress.log
          python3 - <<'PY'
          import re, sys
          out = open("engine_regress.log", encoding="utf-8", errors="replace").read()
          m = re.search(r"\[  PASSED  \] (\d+) tests", out)
          passed = int(m.group(1)) if m else 0
          fails = sorted(set(re.findall(r"^\[  FAILED  \] (\S+)$", out, re.M)))
          allowed = {
              "test_files~extension~extension.LoadNotInstalledExtension",
              "test_files~extension~extension.ForceInstallExtension",
              "test_files~extension~extension.UninstallExtensionError",
          }
          unexpected = [f for f in fails if f not in allowed]
          print(f"engine gate: passed={passed} fails={fails}")
          if passed < 1972 or unexpected:
              print("GATE FAIL, unexpected:", unexpected)
              sys.exit(1)
          print("GATE OK (baseline 1972/1975 with known INSTALL cases, or cleaner)")
          PY

      - name: Upload TCK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-report
          path: extension/gql/test/tck/REPORT.md
          if-no-files-found: ignore
